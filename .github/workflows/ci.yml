name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is available without a flag on Node 24+.
        node-version: ["24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Verify audit chain
        run: npm run verify:audit

  postgres:
    name: Required Postgres migration and conformance gate
    runs-on: ubuntu-latest
    env:
      XYGO_TEST_PG_URL: postgres://xygo:xygo@localhost:5432/xygo_test
      XYGO_API_PG_URL: postgres://xygo:xygo@localhost:5432/xygo_test
      XYGO_REQUIRE_PG_TESTS: "true"
      XYGO_OUTBOX_BACKEND: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xygo
          POSTGRES_PASSWORD: xygo
          POSTGRES_DB: xygo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xygo -d xygo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: npm ci
      - name: Apply Postgres migrations to clean database
        run: npm run migrate:postgres
      - name: Reapply Postgres migrations (idempotency gate)
        run: npm run migrate:postgres
      - name: Verify Postgres readiness without schema mutation
        run: npm run check:postgres
      - name: Verify durable outbox readiness
        run: npm run check:outbox
      - name: Run required Postgres conformance suite
        run: npm run test:postgres
