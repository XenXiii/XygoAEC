<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xygo Business Audit | From Insight to Measurable Growth</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07111f;
    --panel: #0d1c2f;
    --fg: #eef6ff;
    --muted: #9bb0c8;
    --line: #3c5877;
    --input: #123a62;
    --process: #193b70;
    --storage: #0f554f;
    --external: #65471b;
    --risk: #642d38;
    --accent: #55b8ff;
    --good: #72dfc5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .topbar {
    max-width: 1184px;
    margin: 0 auto;
    padding: 18px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { color: var(--fg); font-size: 22px; font-weight: 800; text-decoration: none; }
  .brand span { color: var(--good); }
  .actions { display: flex; gap: 10px; }
  .actions a {
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 14px;
    text-decoration: none;
    font-weight: 700;
  }
  .actions a:last-child { background: var(--good); border-color: var(--good); color: var(--bg); }
  @media (max-width: 640px) {
    .topbar { align-items: flex-start; }
    .actions { flex-direction: column; }
    .actions a { padding: 7px 10px; font-size: 12px; }
  }
  main { max-width: 1220px; margin: 0 auto; padding: 28px 18px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 32px; font-weight: 750; fill: var(--fg); }
  .subtitle { font-size: 16px; fill: var(--muted); }
  .step { font-size: 13px; font-weight: 750; letter-spacing: 1.4px; fill: var(--accent); }
  .label { font-size: 21px; font-weight: 700; fill: var(--fg); }
  .column { font-size: 12px; font-weight: 750; letter-spacing: 1px; fill: var(--muted); }
  .body { font-size: 14px; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--accent); stroke-width: 2; fill: none; }
  .progress { stroke: var(--line); stroke-width: 5; fill: none; }
  .progress-done { stroke: var(--good); stroke-width: 5; fill: none; }
</style>
<header class="topbar">
  <a class="brand" href="/" aria-label="Xygo home">Xy<span>go</span></a>
  <nav class="actions" aria-label="Audit preview actions">
    <a href="/">Back to site</a>
    <a href="/demo">Request an audit</a>
  </nav>
</header>
<main>
