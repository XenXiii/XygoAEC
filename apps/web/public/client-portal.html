<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xygo — Client Portal (staged)</title>
    <meta name="color-scheme" content="dark" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.55 system-ui, sans-serif; background: #0b0d12; color: #e7ebf3; }
      a { color: #8fb4ff; }
      .staged-banner { background: #3a2a00; color: #ffd479; text-align: center; padding: 8px; font-weight: 600; }
      header, main { max-width: 960px; margin: 0 auto; padding: 20px; }
      h1 { font-size: 1.5rem; margin: .2em 0; }
      h2 { font-size: 1.15rem; margin: 6px 0; }
      h3 { font-size: 1rem; margin: 16px 0 6px; }
      h4 { font-size: .9rem; margin: 10px 0 4px; color: #cdd5e6; }
      .muted { color: #9aa4b8; }
      form { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 16px 0; }
      label { display: block; font-size: .8rem; color: #9aa4b8; margin-bottom: 4px; }
      select, input, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a; background: #12151c; color: inherit; }
      button { background: #2f6bff; border-color: #2f6bff; cursor: pointer; font-weight: 600; }
      button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
      .project { border: 1px solid #222836; background: #10131a; border-radius: 12px; padding: 18px; margin: 14px 0; }
      .status { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: #1c2333; color: #8fb4ff; margin-left: 8px; }
      .report { border-left: 3px solid #2f6bff; padding-left: 12px; margin: 10px 0; }
      ul { margin: 4px 0; padding-left: 18px; }
      .pay { border: 1px dashed #3a2a00; background: #17130a; color: #ffd479; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: .88rem; }
      .state { color: #9aa4b8; padding: 12px 0; }
      .error { color: #ff9b9b; }
    </style>
  </head>
  <body>
    <p class="staged-banner">STAGED / SIMULATED DATA — client view; payments are not connected</p>
    <header>
      <a href="/">← Home</a> · <a href="/field-reports.html">Field reporting</a>
      <h1>Client Portal</h1>
      <p class="muted">
        What a client sees: project status, approved reports, shared files, and updates. Only
        <strong>approved</strong> reports appear here. Payment is a staged placeholder — no live billing.
      </p>
      <form id="controls">
        <div>
          <label for="tenant">Client (staged tenant)</label>
          <select id="tenant">
            <option value="tenant-commercial-sim">Commercial Simulation</option>
            <option value="tenant-residential-sim">Residential Simulation</option>
          </select>
        </div>
        <div>
          <label for="api-base">API base URL</label>
          <input id="api-base" type="url" value="http://127.0.0.1:3000" size="26" />
        </div>
        <button type="submit">Load portal</button>
      </form>
    </header>

    <main id="main">
      <div id="status" class="state" role="status" aria-live="polite">Loading…</div>
      <section id="portals" aria-label="Client portal projects"></section>
    </main>

    <script type="module" src="/client-portal.js"></script>
  </body>
</html>
